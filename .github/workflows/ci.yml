name: CI

# Default branch is `master`; pull requests from any branch run the fast job.
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to keep metered minutes down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required, fast gate: static analysis + unit/widget tests.
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Windows: prove the desktop build compiles. Unlike Linux, playback does not
  # need a system libmpv — media_kit_libs_windows_audio downloads a prebuilt
  # mpv 7z archive at CMake configure time. The archive is cached across runs
  # (a fresh download from GitHub can be flaky); CMake still verifies its MD5,
  # so a corrupt cached/downloaded file is caught at build time.
  build-windows:
    name: Build Windows (release)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # The archive filename embeds its pinned build (2023-09-24);
      # bump the key in lockstep with media_kit_libs_windows_audio in pubspec.
      - name: Cache libmpv archive (media_kit_libs_windows_audio)
        id: cache-mpv
        uses: actions/cache@v6
        with:
          path: build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z
          key: mpv-win32-audio-20230924-652a1dd

      - name: Download libmpv archive if not cached
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64 | Out-Null
          curl.exe -L --retry 5 --retry-delay 2 --connect-timeout 30 `
            -o build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z `
            https://github.com/media-kit/libmpv-win32-audio-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows bundle
        run: flutter build windows --release

  # Apple targets are non-primary and ship unsigned: macOS keeps its sandbox
  # (only the network-client entitlement is added) and the iOS IPA is packed
  # without codesign so users sideload it with their own signing.
  build-macos:
    name: Build macOS (release)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS bundle
        run: flutter build macos --release

      - name: Package macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Flind Player.app" \
            "$GITHUB_WORKSPACE/FlindPlayer-${{ github.ref_name }}-macos-$(uname -m).zip"

  build-ios:
    name: Build iOS (release, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "FlindPlayer-${{ github.ref_name }}-ios-unsigned.ipa" Payload

  # Optional but useful: prove the desktop build still compiles and ships a
  # runnable bundle. Linux builds need system libmpv (see docs/local-library.md
  # §5: `libsecret` for credentials, `libmpv-dev` + `mpv` for playback,
  # `libayatana-appindicator3-dev` for the tray).
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libmpv-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: flind-player-linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 7
