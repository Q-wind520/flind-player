name: CI

# Default branch is `master`; pull requests from any branch run the fast job.
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to keep metered minutes down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required, fast gate: static analysis + unit/widget tests.
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Optional but useful: prove the desktop build still compiles and ships a
  # runnable bundle. Linux builds need system libmpv (see docs/local-library.md
  # §5: `libsecret` for credentials, `libmpv-dev` + `mpv` for playback,
  # `libayatana-appindicator3-dev` for the tray).
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libmpv-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: flind-player-linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 7
