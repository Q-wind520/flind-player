name: Release

# A single tag push (`git tag v0.1.0 && git push origin v0.1.0`) builds the
# desktop and Android artifacts and publishes a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # System libmpv is required for playback (see docs/local-library.md §5).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libmpv-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          tar -czf "FlindPlayer-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: FlindPlayer-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repository secrets a maintainer must add for a signed release:
      #   ANDROID_KEYSTORE_BASE64    - base64 of the .jks keystore
      #   ANDROID_KEYSTORE_PASSWORD  - keystore password
      #   ANDROID_KEY_ALIAS          - key alias inside the keystore
      #   ANDROID_KEY_PASSWORD       - password for that key alias
      # When ANDROID_KEYSTORE_BASE64 is absent, android/app/build.gradle.kts
      # falls back to the debug signing config so the workflow still succeeds
      # (such a build is NOT fit for distribution).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Decode the keystore into android/app/keystore.jks and write
      # android/key.properties (both gitignored). Skipped when no secret is set,
      # in which case the Gradle config uses the debug signing fallback.
      - name: Configure Android signing (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      # Universal APK: friendliest for sideloading (works on any device).
      - name: Build universal APK
        run: flutter build apk --release

      # App Bundle: required by Google Play.
      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts with the version tag
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "FlindPlayer-${GITHUB_REF_NAME}.apk"
          mv build/app/outputs/bundle/release/app-release.aab \
             "FlindPlayer-${GITHUB_REF_NAME}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: FlindPlayer-${{ github.ref_name }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/linux-release/*.tar.gz
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
          # GPL-3.0 §6: distributing binaries obliges us to offer the
          # corresponding source. GitHub attaches auto-generated
          # "Source code (zip/tar.gz)" archives to every release, which point at
          # exactly the tagged commit the binaries were built from.
          body: |
            ## Flind Player ${{ github.ref_name }}

            ### 对应源码 / Corresponding source

            本程序以 **GPL-3.0** 分发。依据 GPL-3.0 §6，分发二进制时必须同时提供
            完整对应源码；该源码即本标签对应的仓库快照，可直接使用本 Release 页面
            下方的 **Source code (zip / tar.gz)** 下载。

            Licensed under **GPL-3.0**. In accordance with GPL-3.0 §6, the complete
            corresponding source for the binaries below is the repository at tag
            `${{ github.ref_name }}` — see the auto-generated
            **Source code (zip / tar.gz)** archives on this page.

            https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}

            ### 产物 / Assets

            | 文件 | 说明 |
            | --- | --- |
            | `FlindPlayer-${{ github.ref_name }}-linux-x64.tar.gz` | Linux 桌面版（解压后运行 `flind_player`；需要系统 `libmpv.so.2`） |
            | `FlindPlayer-${{ github.ref_name }}.apk` | Android 通用 APK（含全部 CPU 架构，体积较大） |
            | `FlindPlayer-${{ github.ref_name }}.aab` | Android App Bundle（用于 Google Play 上架） |

            > 图标为当前占位稿，后续会替换。
