name: Release

# A single tag push (`git tag v0.1.0 && git push origin v0.1.0`) builds the
# desktop and Android artifacts and publishes a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # System libmpv is required for playback (see docs/local-library.md §5).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libmpv-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          tar -czf "FlindPlayer-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: FlindPlayer-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows (release)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # media_kit_libs_windows_audio downloads this prebuilt mpv 7z at CMake
      # configure time; cache it (fresh GitHub downloads can be flaky) and let
      # the plugin's own MD5 check catch any corruption.
      - name: Cache libmpv archive (media_kit_libs_windows_audio)
        id: cache-mpv
        uses: actions/cache@v6
        with:
          path: build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z
          key: mpv-win32-audio-20230924-652a1dd

      - name: Download libmpv archive if not cached
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64 | Out-Null
          curl.exe -L --retry 5 --retry-delay 2 --connect-timeout 30 `
            -o build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z `
            https://github.com/media-kit/libmpv-win32-audio-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows bundle
        run: flutter build windows --release

      - name: Package Windows bundle
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "FlindPlayer-$env:GITHUB_REF_NAME-windows-x64.zip"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: FlindPlayer-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS (release)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS bundle
        run: flutter build macos --release

      - name: Package macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "Flind Player.app" \
            "$GITHUB_WORKSPACE/FlindPlayer-${GITHUB_REF_NAME}-macos-x64.zip"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: FlindPlayer-*-macos-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build iOS (release, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "FlindPlayer-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload

      - name: Upload iOS archive
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: FlindPlayer-*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repository secrets a maintainer must add for a signed release:
      #   ANDROID_KEYSTORE_BASE64    - base64 of the .jks keystore
      #   ANDROID_KEYSTORE_PASSWORD  - keystore password
      #   ANDROID_KEY_ALIAS          - key alias inside the keystore
      #   ANDROID_KEY_PASSWORD       - password for that key alias
      # When ANDROID_KEYSTORE_BASE64 is absent, android/app/build.gradle.kts
      # falls back to the debug signing config so the workflow still succeeds
      # (such a build is NOT fit for distribution).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Decode the keystore into android/app/keystore.jks and write
      # android/key.properties (both gitignored). Skipped when no secret is set,
      # in which case the Gradle config uses the debug signing fallback.
      - name: Configure Android signing (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Stage artifacts with the version tag
        run: |
          for abi in armeabi-v7a arm64-v8a; do
            mv "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "FlindPlayer-${GITHUB_REF_NAME}-${abi}.apk"
          done
          mv build/app/outputs/bundle/release/app-release.aab \
             "FlindPlayer-${GITHUB_REF_NAME}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          # No dot after the tag, so the `-<abi>` / `-universal` suffixed names match.
          path: FlindPlayer-${{ github.ref_name }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Hyphenated tags (-pre / -beta) publish as GitHub pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/linux-release/*.tar.gz
            artifacts/windows-release/*.zip
            artifacts/macos-release/*.zip
            artifacts/ios-release/*.ipa
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
          # GPL-3.0 §6: distributing binaries obliges us to offer the
          # corresponding source. GitHub attaches auto-generated
          # "Source code (zip/tar.gz)" archives to every release, which point at
          # exactly the tagged commit the binaries were built from.
          body: |
            ## Flind Player ${{ github.ref_name }}

            ### 对应源码 / Corresponding source

            本程序以 **GPL-3.0** 分发。依据 GPL-3.0 §6，分发二进制时必须同时提供
            完整对应源码；该源码即本标签对应的仓库快照，可直接使用本 Release 页面
            下方的 **Source code (zip / tar.gz)** 下载。

            Licensed under **GPL-3.0**. In accordance with GPL-3.0 §6, the complete
            corresponding source for the binaries below is the repository at tag
            `${{ github.ref_name }}` — see the auto-generated
            **Source code (zip / tar.gz)** archives on this page.

            https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}

            ### 产物 / Assets

            | 文件 | 说明 |
            | --- | --- |
            | `FlindPlayer-${{ github.ref_name }}-linux-x64.tar.gz` | Linux 桌面版（解压后运行 `flind_player`；需要系统 `libmpv.so.2`） |
            | `FlindPlayer-${{ github.ref_name }}-windows-x64.zip` | Windows 桌面版（解压后运行 `flind_player.exe`，已内置 mpv，无需额外依赖） |
            | `FlindPlayer-${{ github.ref_name }}-macos-x64.zip` | macOS 桌面版（**未签名**；解压后需 `xattr -dr com.apple.quarantine "Flind Player.app"` 再打开） |
            | `FlindPlayer-${{ github.ref_name }}-ios-unsigned.ipa` | iOS（**未签名**；需用 AltStore / Sideloadly 等工具自行签名安装；暂不支持本地曲库） |
            | `FlindPlayer-${{ github.ref_name }}-arm64-v8a.apk` | **绝大多数现代手机选这个**（体积最小） |
            | `FlindPlayer-${{ github.ref_name }}-armeabi-v7a.apk` | 较老的 32 位 Android 设备 |
            | `FlindPlayer-${{ github.ref_name }}.aab` | Android App Bundle（用于 Google Play 上架） |

            > **预览版说明**：0.1.x 使用调试签名，**各版本之间不支持覆盖升级**。安装新版本
            > 前需先卸载旧版本，本地数据（曲库索引、收藏、播放队列）会随之清除。正式签名
            > 将在 1.0 引入。
            >
            > **Preview builds**: 0.1.x is signed with the debug key, so builds are
            > **not upgradable in place** — uninstall the previous version first.
            > Release signing arrives in 1.0.
