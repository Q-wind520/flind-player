org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Flutter normally gives each `--split-per-abi` APK a version code of
# ABI_VERSION * 1000 + pubspec versionCode (arm64-v8a turns `1.1.0+15` into
# 2015). A debug `flutter run` build is not split, so it keeps 15, and installing
# it over a released APK fails as a version downgrade. Forcing the plain pubspec
# versionCode keeps debug and release mutually installable. The AAB is
# unaffected: it is built without a split, and Play assigns split version codes.
force-version-code-ignoring-abi=true
