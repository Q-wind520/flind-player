name: flind_player
description: "Flind Player - a cross-platform music player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  audio_metadata_reader: ^1.8.0
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  audio_session: ^0.2.4
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image: ^4.9.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  file_picker_platform_interface: ^3.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    # App icon assets used by flutter_launcher_icons and the Linux CMake install.
    - assets/icon/
    # Monochrome tray icon (white on transparent, 96x96).
    - assets/tray/

# =============================================================================
# flutter_launcher_icons — regenerate with: dart run flutter_launcher_icons
# Or use the full pipeline: ./tool/generate_icons.sh
# =============================================================================
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android:
    generate: true
    image_path: "assets/icon/app_icon.png"
    adaptive_icon_background: "#FE9288"
    adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios:
    generate: true
    image_path: "assets/icon/app_icon.png"
    remove_alpha_ios: true

  web:
    generate: true
    background_color: "#FE9288"
    theme_color: "#FE9288"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
